# Read the Docs configuration
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.11"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: false

# Only the documentation toolchain is installed. The package is imported from
# the source tree (conf.py adds it to sys.path) and its heavy dependencies are
# mocked, so torch/scanpy never need to be downloaded on the builder.
python:
  install:
    - requirements: docs/requirements.txt

formats:
  - htmlzip
  - pdf
