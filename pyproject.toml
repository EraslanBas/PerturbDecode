[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "PerturbDecode"
version = "0.1.0"
description = "An end-to-end toolkit for analysing large-scale single-cell perturbation screens"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
authors = [{ name = "Basak Eraslan", email = "basak.eraslan1@gmail.com" }]
keywords = [
    "single-cell",
    "perturbation",
    "CRISPR",
    "Perturb-seq",
    "variational-autoencoder",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

# Runtime requirements, derived from the modules' actual imports.
dependencies = [
    "numpy>=1.20",
    "pandas>=1.3",
    "scipy>=1.7",
    "scanpy>=1.9",
    "anndata>=0.8",
    "torch>=1.10",
    "scikit-learn>=1.0",
    "statsmodels>=0.13",
    "pingouin>=0.5",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "tqdm>=4.60",
]

[project.optional-dependencies]
# R interoperability is optional: the core pipeline imports cleanly without it.
r = ["rpy2>=3.4", "anndata2ri>=1.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]
docs = ["sphinx>=5.0", "sphinx_rtd_theme", "myst-parser"]

[project.urls]
Homepage = "https://github.com/EraslanBas/PerturbDecodeMulti"
Repository = "https://github.com/EraslanBas/PerturbDecodeMulti"

[project.scripts]
perturbdecode = "perturbdecode.cli:main"

[tool.setuptools.packages.find]
include = ["perturbdecode*"]
exclude = ["tests*", "docs*", "examples*", "ComBVAE*"]

[tool.setuptools.package-data]
perturbdecode = ["R/*.R"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"

[tool.ruff]
line-length = 100
target-version = "py38"
